<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <title>MyJD Click'n'Load</title>
  <link rel="stylesheet" href="ui.css">
  <style>
    body { width: 340px; padding: 12px 14px; }
    .head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    ul { list-style: none; margin: 8px 0 0; padding: 0; max-height: 260px; overflow-y: auto; }
    li { padding: 6px 0; border-top: 1px solid var(--line); }
    li .t { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    li .m { font-size: 12px; color: var(--muted); }
  </style>
</head>
<body>
  <div class="head">
    <strong>MyJD Click'n'Load</strong>
    <label class="inline" style="margin:0"><input type="checkbox" id="enabled"> aktiv</label>
  </div>
  <div id="state" class="status"></div>
  <div class="muted" style="margin-top:8px">Zuletzt gesendet</div>
  <ul id="history"></ul>
  <div class="row">
    <button id="options">Einstellungen</button>
    <button id="clear">Verlauf leeren</button>
  </div>
<script src="popup.js"></script>
</body>
</html>
