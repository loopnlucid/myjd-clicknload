<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>MyJD Click'n'Load – Settings</title>
  <link rel="stylesheet" href="ui.css">
  <style>main { max-width: 560px; margin: 24px auto; padding: 0 16px; }</style>
</head>
<body>
<main>
  <h1>MyJD Click'n'Load</h1>
  <p class="muted">Click'n'Load buttons are intercepted and sent to your JDownloader via my.jdownloader.org.</p>

  <section class="card" id="loginCard">
    <h2>1. MyJDownloader account</h2>
    <div id="loggedIn" hidden>
      Logged in as <strong id="curEmail"></strong>
      <div class="row"><button id="logout">Log out</button></div>
    </div>
    <div id="loginForm">
      <label for="email">Email</label>
      <input type="email" id="email" autocomplete="username">
      <label for="password">Password</label>
      <input type="password" id="password" autocomplete="current-password">
      <p class="muted">Your password is not stored – only the keys derived from it.</p>
      <div class="row"><button class="primary" id="login">Log in &amp; load devices</button></div>
    </div>
    <div class="status" id="loginStatus"></div>
  </section>

  <section class="card">
    <h2>2. Target JDownloader</h2>
    <label for="device">Device</label>
    <select id="device"><option value="">– log in first –</option></select>
    <div class="row">
      <button id="reload">Refresh device list</button>
      <button id="test">Test connection</button>
    </div>
    <div class="status" id="deviceStatus"></div>
  </section>

  <section class="card">
    <h2>3. Options</h2>
    <label class="inline"><input type="checkbox" id="enabled"> Intercept Click'n'Load</label>
    <label class="inline"><input type="checkbox" id="autostart"> Start downloads in JDownloader immediately (autostart)</label>
    <label class="inline"><input type="checkbox" id="notifications"> Show a notification after sending successfully</label>
    <label for="dest">Download folder on the JDownloader (optional)</label>
    <input type="text" id="dest" placeholder="empty = JDownloader's default folder">
    <div class="status" id="optStatus"></div>
  </section>
</main>
<script type="module" src="options.js"></script>
</body>
</html>
