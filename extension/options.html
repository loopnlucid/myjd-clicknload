<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <title>MyJD Click'n'Load – Einstellungen</title>
  <link rel="stylesheet" href="ui.css">
  <style>main { max-width: 560px; margin: 24px auto; padding: 0 16px; }</style>
</head>
<body>
<main>
  <h1>MyJD Click'n'Load</h1>
  <p class="muted">Click'n'Load-Buttons werden abgefangen und über my.jdownloader.org an deinen JDownloader geschickt.</p>

  <section class="card" id="loginCard">
    <h2>1. MyJDownloader-Konto</h2>
    <div id="loggedIn" hidden>
      Angemeldet als <strong id="curEmail"></strong>
      <div class="row"><button id="logout">Abmelden</button></div>
    </div>
    <div id="loginForm">
      <label for="email">E-Mail</label>
      <input type="email" id="email" autocomplete="username">
      <label for="password">Passwort</label>
      <input type="password" id="password" autocomplete="current-password">
      <p class="muted">Das Passwort wird nicht gespeichert, nur die daraus abgeleiteten Schlüssel.</p>
      <div class="row"><button class="primary" id="login">Anmelden &amp; Geräte laden</button></div>
    </div>
    <div class="status" id="loginStatus"></div>
  </section>

  <section class="card">
    <h2>2. Ziel-JDownloader</h2>
    <label for="device">Gerät</label>
    <select id="device"><option value="">– erst anmelden –</option></select>
    <div class="row">
      <button id="reload">Geräteliste aktualisieren</button>
      <button id="test">Verbindung testen</button>
    </div>
    <div class="status" id="deviceStatus"></div>
  </section>

  <section class="card">
    <h2>3. Optionen</h2>
    <label class="inline"><input type="checkbox" id="enabled"> Click'n'Load abfangen</label>
    <label class="inline"><input type="checkbox" id="autostart"> Downloads im JDownloader sofort starten (Autostart)</label>
    <label class="inline"><input type="checkbox" id="notifications"> Benachrichtigung bei erfolgreichem Senden</label>
    <label for="dest">Zielordner auf dem JDownloader (optional)</label>
    <input type="text" id="dest" placeholder="leer = Standard-Ordner des JDownloaders">
    <div class="status" id="optStatus"></div>
  </section>
</main>
<script type="module" src="options.js"></script>
</body>
</html>
